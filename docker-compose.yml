services:
  postgres:
    image: postgres:17-alpine
    container_name: medcred-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: medcred
      POSTGRES_PASSWORD: medcred_local_only
      POSTGRES_DB: medcred
    ports:
      - "5432:5432"
    volumes:
      - medcred-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medcred -d medcred"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  medcred-pgdata:
